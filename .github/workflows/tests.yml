name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    services:
      # Real Postgres so the sharing tests also cover the production backend.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labtrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LABTRAIL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labtrail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system packages (packages.txt)
        run: sudo apt-get update && xargs -a packages.txt sudo apt-get install -y
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  deploy-check:
    # Mirrors Streamlit Community Cloud: only requirements.txt and packages.txt,
    # then loads the app and the demo samples headlessly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system packages (packages.txt)
        run: sudo apt-get update && xargs -a packages.txt sudo apt-get install -y
      - name: Install runtime dependencies only
        run: python -m pip install -r requirements.txt
      - name: Database drivers import
        run: python -c "import sqlalchemy, psycopg; print(sqlalchemy.__version__, psycopg.__version__)"
      - name: Start the app and load the samples
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=120).run()
          assert not at.exception, at.exception
          next(b for b in at.button if b.label.startswith("Load 3 synthetic")).click()
          at.run()
          assert not at.exception, at.exception
          assert len(at.session_state["reports"]) == 3
          print("App starts and processes the samples with runtime dependencies only.")
          PY
